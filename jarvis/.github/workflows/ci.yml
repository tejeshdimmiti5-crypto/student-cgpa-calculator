name: JARVIS CI

on:
  push:
    paths:
      - "jarvis/**"
  pull_request:
    paths:
      - "jarvis/**"

jobs:
  python-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/python-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis/desktop/package-lock.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
