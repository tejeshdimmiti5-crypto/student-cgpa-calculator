services:
  jarvis-api:
    build:
      context: ./python-core
      dockerfile: Dockerfile
    environment:
      JARVIS_ENV: production
      JARVIS_LLM_PROVIDER: ${JARVIS_LLM_PROVIDER:-mock}
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_postgres:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  jarvis_postgres:
